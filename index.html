function render(d){
  var x=D[d],h='<div class="dayhead"><h2>'+x.h+'</h2><p>'+x.s+'</p></div><ol class="tl">';
  x.rows.forEach(function(r,i){
    h+='<li class="row"><div class="time">'+r.t+(r.t2?'<small>'+r.t2+'</small>':'')+'</div><div style="min-width:0">'+
    '<p class="title">'+(r.tag?'<span class="tag'+(r.r&&r.tag!='카페'?' eat':'')+'">'+r.tag+'</span>':'')+esc(r.ti)+'</p>'+(r.n?'<p class="note">'+esc(r.n)+'</p>':'');
    if(r.r)h+=restCard(r.r);
    if(r.shop)h+=shopCard(r.shop);
    if(r.steps)h+=steps(r.steps);
    if(r.tl&&!r.trail)h+=tlist(r.tl);
    if(r.trail&&r.tl)h+=tlist(r.tl);
    if(r.trail)h+='<button class="btn primary trailbtn" type="button" aria-expanded="false" data-trail="1">등산로 코스 보기</button><div hidden data-tbox></div>';
    h+='</div></li>';
  });
  document.getElementById('panel').innerHTML=h+'</ol>';
}
function show(d,push){
  [1,2,3].forEach(function(i){var t=document.getElementById('t'+i);t.setAttribute('aria-selected',i==d)});
  render(d);
  if(push){try{history.replaceState(null,'','#day'+d)}catch(e){location.hash='day'+d}}
  scrollTo(0,0);
}
document.addEventListener('click',function(e){
  var t=e.target.closest('.tab');if(t){show(+t.dataset.d,1);return}
  var c=e.target.closest('[data-copy]');if(c){copyTxt(c.dataset.copy,c);return}
  var b=e.target.closest('[data-trail]');if(b){
    var box=b.nextElementSibling,open=box.hidden;
    if(open&&!box.innerHTML)box.innerHTML=TRAIL;
    box.hidden=!open;b.setAttribute('aria-expanded',open);b.textContent=open?'등산로 코스 닫기':'등산로 코스 보기';
  }
});
var m=/day([123])/.exec(location.hash);show(m?+m[1]:1,0);
addEventListener('hashchange',function(){var m=/day([123])/.exec(location.hash);if(m)show(+m[1],0)});
